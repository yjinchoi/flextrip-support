name: 버그 보고 / Bug report
description: 앱이 예상과 다르게 동작할 때 / Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        이 게시판은 공개됩니다. 여행 일정, 주소, 이메일, 사진 같은 개인정보는 적지 마세요.
        Issues are public. Please don't include personal information.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? / What happened?
      description: 무엇을 했고, 무엇을 기대했고, 실제로 어떻게 됐는지 / What you did, what you expected, what happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법 / Steps to reproduce
      placeholder: |
        1. 설정 › 클라우드 계정
        2. Dropbox 연결
        3. ...
  - type: input
    id: version
    attributes:
      label: 앱 버전 / App version
      placeholder: 예/e.g. 0.3.1
  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼 / Platform
      options: [iOS, iPadOS, Android]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 기기와 OS 버전 / Device and OS version
      placeholder: 예/e.g. iPhone 16, iOS 27.0
  - type: textarea
    id: extra
    attributes:
      label: 화면에 보인 오류 메시지·스크린샷 / Error message or screenshot
      description: 개인정보가 보이지 않게 가려 주세요 / Please hide personal information
