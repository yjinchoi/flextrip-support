title: FlexTrip
description: 유연하게 바꾸는 여행 계획 앱 FlexTrip
url: https://flex-trip.net
baseurl: ""
repository: yjinchoi/flextrip-support
lang: ko
exclude:
  - README.md
permalink: /blog/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  path: blog/feed.xml
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: posts }
    values: { layout: post }
